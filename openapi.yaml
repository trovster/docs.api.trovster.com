  '/activities/{strava_id}':
    get:
      summary: 'Get an Activity'
      operationId: getAnActivity
      description: "This endpoint allows you to get a specific activity, based on the Strava ID.\nThe entry contains the same information provided in the listing, but also includes\nany extra text and the polyline representation. The type is an object which includes\nthe ID as well as the type name.\n<strong>The summary is a useful sentence describing the activity.</strong>\n<aside>The polyline can be used with mapping software to show the route.</aside>"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 3
                    stravaId: 401200
                    title: 'eos excepturi voluptas'
                    date: '2026-09-13T15:41:43+00:00'
                    summary: 'Walked for 2 seconds on 13th September 2026.'
                    speed: 48.4744898
                    distance: 0
                    timeMoving: 0.033333333333333
                    html: "<p>Delectus incidunt asperiores aut et quis amet veritatis ipsa. Qui dolor quod maiores quidem. Voluptate delectus magni doloremque consequatur ab ratione.</p>\n"
                    polyline: 4574e258-02a4-3b50-a272-cea2f4b937b4
                    heartRateZones: []
                    type:
                      id: 3
                      name: Walk
                    links:
                      self: 'http://api.trovster.com/activities/401200'
                      permalink: 'http://www.trovster.com/activities/401200'
                      strava: 'https://www.strava.com/activities/401200'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 3
                      stravaId:
                        type: integer
                        example: 401200
                      title:
                        type: string
                        example: 'eos excepturi voluptas'
                      date:
                        type: string
                        example: '2026-09-13T15:41:43+00:00'
                      summary:
                        type: string
                        example: 'Walked for 2 seconds on 13th September 2026.'
                      speed:
                        type: number
                        example: 48.4744898
                      distance:
                        type: integer
                        example: 0
                      timeMoving:
                        type: number
                        example: 0.033333333333333
                      html:
                        type: string
                        example: "<p>Delectus incidunt asperiores aut et quis amet veritatis ipsa. Qui dolor quod maiores quidem. Voluptate delectus magni doloremque consequatur ab ratione.</p>\n"
                      polyline:
                        type: string
                        example: 4574e258-02a4-3b50-a272-cea2f4b937b4
                      heartRateZones:
                        type: array
                        example: []
                      type:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 3
                          name:
                            type: string
                            example: Walk
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: 'http://api.trovster.com/activities/401200'
                          permalink:
                            type: string
                            example: 'http://www.trovster.com/activities/401200'
                          strava:
                            type: string
                            example: 'https://www.strava.com/activities/401200'
      tags:
        - Activities
    parameters:
      -
        in: path
        name: strava_id
        description: 'The ID of the Strava activity.'
        example: 7487429528
        required: true
        schema:
          type: integer
