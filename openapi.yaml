      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 3368
                      stravaId: 8
                      title: 'ut dolores culpa'
                      date: '2026-01-14T05:51:19+00:00'
                      summary: 'Walked for 8 seconds on 14th January 2026.'
