  '/activities/{strava_id}':
    get:
      summary: 'Get an Activity'
      operationId: getAnActivity
      description: "This endpoint allows you to get a specific activity, based on the Strava ID.\nThe entry contains the same information provided in the listing, but also includes\nany extra text and the polyline representation. The type is an object which includes\nthe ID as well as the type name.\n<strong>The summary is a useful sentence describing the activity.</strong>\n<aside>The polyline can be used with mapping software to show the route.</aside>"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 3370
                    stravaId: 70068
                    title: 'ducimus incidunt nisi'
                    date: '2026-01-14T08:05:42+00:00'
                    summary: 'Cycled for 7 seconds on 14th January 2026.'
                    speed: 94.3541292
                    distance: 0
                    timeMoving: 0.11666666666667
                    html: "<p>Ducimus et et qui qui aut cum. Occaecati in blanditiis voluptatem omnis quis consequatur quod. Sunt suscipit pariatur ut et quia voluptate repudiandae. Ea velit velit ipsam et unde quos.</p>\n"
                    polyline: e3968ccb-a5f4-3699-92a5-03bd6cf9b85f
                    type:
                      id: 15
                      name: 'E-Bike Ride'
                    links:
                      self: 'http://api.trovster.com/activities/70068'
                      permalink: 'http://www.trovster.com/activities/70068'
                      strava: 'https://www.strava.com/activities/70068'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 3370
                      stravaId:
                        type: integer
                        example: 70068
                      title:
                        type: string
                        example: 'ducimus incidunt nisi'
                      date:
                        type: string
                        example: '2026-01-14T08:05:42+00:00'
                      summary:
                        type: string
                        example: 'Cycled for 7 seconds on 14th January 2026.'
                      speed:
                        type: number
                        example: 94.3541292
                      distance:
                        type: integer
                        example: 0
                      timeMoving:
                        type: number
                        example: 0.11666666666667
                      html:
                        type: string
                        example: "<p>Ducimus et et qui qui aut cum. Occaecati in blanditiis voluptatem omnis quis consequatur quod. Sunt suscipit pariatur ut et quia voluptate repudiandae. Ea velit velit ipsam et unde quos.</p>\n"
                      polyline:
                        type: string
                        example: e3968ccb-a5f4-3699-92a5-03bd6cf9b85f
                      type:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 15
                          name:
                            type: string
                            example: 'E-Bike Ride'
                      links:
                        type: object
                        properties:
                          self:
                            type: string
                            example: 'http://api.trovster.com/activities/70068'
                          permalink:
                            type: string
                            example: 'http://www.trovster.com/activities/70068'
                          strava:
                            type: string
                            example: 'https://www.strava.com/activities/70068'
      tags:
        - Activities
    parameters:
      -
        in: path
        name: strava_id
        description: 'The ID of the Strava activity.'
        example: 7487429528
        required: true
        schema:
          type: integer
